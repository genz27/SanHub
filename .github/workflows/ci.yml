name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: [self-hosted, cursor]
    steps:
      - uses: actions/checkout@v4
      - name: Detect stack and run checks
        run: |
          /home/box/ci/run.sh "$GITHUB_WORKSPACE" "${GITHUB_REPOSITORY#*/}" /home/box/ci/logs/${GITHUB_REPOSITORY#*/}.log
          tail -n 30 "/home/box/ci/logs/${GITHUB_REPOSITORY#*/}.log"
